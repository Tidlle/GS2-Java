# Configuração comum a todos os perfis.
# Valores sensíveis vêm sempre de variáveis de ambiente (veja .env.example).
spring:
  application:
    name: zela-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # O schema é criado pelo Flyway; o Hibernate só confere se as entidades batem com as tabelas.
      ddl-auto: validate
    properties:
      hibernate:
        # Datas gravadas em UTC numa coluna TIMESTAMP simples (portável entre bancos).
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    # Uma pasta por banco: db/migration/h2, db/migration/sqlserver, db/migration/oracle…
    locations: classpath:db/migration/{vendor}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  ai:
    model:
      # "none" desliga o cliente do Gemini e usa a IA simulada; "google-genai" liga o Gemini (Fase 6).
      chat: ${IA_PROVEDOR:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${IA_MODELO:gemini-2.5-flash}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # Página em JSON estável: { content: [...], page: { size, number, totalElements, totalPages } }
        serialization-mode: via-dto
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

zela:
  ambiente: ${ZELA_AMBIENTE:local}
  mensagem: Zela — zeladoria colaborativa com IA
  jwt:
    secret: ${JWT_SECRET}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  cors:
    # Lista separada por vírgula. "*" libera qualquer origem (o token vai no cabeçalho, sem cookies).
    origens: ${CORS_ORIGENS:*}
