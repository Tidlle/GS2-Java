# Configuração comum a todos os perfis.
# Valores sensíveis vêm sempre de variáveis de ambiente (veja .env.example).
spring:
  application:
    name: zela-api
  profiles:
    default: dev
  config:
    # Lê variáveis locais do arquivo .env (formato CHAVE=valor), se existir. Ele não vai para o Git.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # O schema é criado pelo Flyway; o Hibernate só confere se as entidades batem com as tabelas.
      ddl-auto: validate
    properties:
      hibernate:
        # Datas gravadas em UTC numa coluna TIMESTAMP simples (portável entre bancos).
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    # Uma pasta por banco: db/migration/h2, db/migration/sqlserver, db/migration/oracle…
    # db/demo traz o histórico de OS encerradas usado nos indicadores (os testes não carregam).
    locations: classpath:db/migration/{vendor},classpath:db/demo/{vendor}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Até 3 tentativas; depois a mensagem vai para a fila .dlq (não volta para a fila e não trava).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
  ai:
    model:
      # "none" desliga o cliente do Gemini e usa a IA simulada; "google-genai" liga o Gemini (Fase 6).
      chat: ${IA_PROVEDOR:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${IA_MODELO:gemini-3.5-flash-lite}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # Página em JSON estável: { content: [...], page: { size, number, totalElements, totalPages } }
        serialization-mode: via-dto
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  health:
    # A API continua funcionando sem o RabbitMQ (só os avisos deixam de sair, com erro no log).
    # Por isso o broker não entra no health check: senão a nuvem reiniciaria o container em loop.
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

zela:
  ambiente: ${ZELA_AMBIENTE:local}
  mensagem: Zela — zeladoria colaborativa com IA
  jwt:
    secret: ${JWT_SECRET}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  mensageria:
    # rabbitmq: eventos vão para o RabbitMQ e são consumidos de forma assíncrona (padrão).
    # local: processados no mesmo processo, sem broker (testes ou rodar sem Docker).
    modo: ${MENSAGERIA_MODO:rabbitmq}
  fotos:
    # Pasta das fotos enviadas (no container, montar um volume aqui).
    diretorio: ${FOTOS_DIRETORIO:uploads}
  regras:
    confirmacoes-para-confirmar: 3
    negacoes-para-descartar: 3
    prazo-urgencia-horas: 4
    raio-padrao-metros: 2000
    raio-checkin-metros: 100
    horas-sem-confirmacao: 24
    horas-aceite-tacito: 48
    confianca-aceite-tacito: 0.8
  agendamento:
    # Liga a verificação periódica de prazos (confirmação em 24 h, escalonamento, aceite tácito).
    habilitado: ${AGENDAMENTO_HABILITADO:true}
    # Intervalo entre verificações (ISO-8601: PT5M = 5 minutos). Na demo, PT1M.
    intervalo: ${AGENDAMENTO_INTERVALO:PT5M}
  cors:
    # Lista separada por vírgula. "*" libera qualquer origem (o token vai no cabeçalho, sem cookies).
    origens: ${CORS_ORIGENS:*}
