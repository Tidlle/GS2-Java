# Perfil de testes: roda sem serviços externos (sem RabbitMQ e sem chave de IA),
# como o pipeline de CI exige.
spring:
  datasource:
    url: jdbc:h2:mem:zela-teste;DB_CLOSE_DELAY=-1;TIME ZONE=UTC
    username: sa
    password:
  flyway:
    # Sem o histórico de demonstração: os testes conferem números exatos da carga inicial.
    locations: classpath:db/migration/{vendor}
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  ai:
    model:
      chat: none

zela:
  ambiente: test
  mensageria:
    modo: local
  agendamento:
    # Nos testes os ciclos de prazo são disparados pelo endpoint, nunca pelo relógio.
    habilitado: false
  fotos:
    diretorio: target/fotos-teste
  jwt:
    secret: teste-zela-segredo-com-pelo-menos-32-bytes!!
